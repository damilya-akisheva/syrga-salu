<dialog id="form-popup" class="popup qe2-card rounded-2xl p-7 shadow-md">
    <h3 class="font-qe2 text-center text-2xl font-semibold" style="color: rgb(140, 31, 53);"><span
            data-popup-title></span></h3>
    <div class="mx-auto mt-3 h-px w-12"
         style="background: linear-gradient(to right, transparent, rgb(196, 136, 60), transparent);"></div>
    <p class="font-qe2-body mt-4 text-center text-sm leading-relaxed" style="color: rgb(61, 21, 32);"><span
            data-popup-text></span></p>
    <form method="dialog" class="mt-6">
        <button class="font-qe2-body w-full rounded-full py-3 text-xs font-semibold uppercase tracking-[0.2em] text-white shadow-md transition hover:opacity-90"
                style="background: linear-gradient(135deg, rgb(140, 31, 53) 0%, rgb(176, 48, 80) 100%);"><span
                data-i18n="popup.close"></span></button>
    </form>
</dialog>
<script>
    // Apps Script Web App URL — placeholder replaced by scripts/build.sh from APPS_SCRIPT_URL.
    var API = '__APPS_SCRIPT_URL__';

    // Countdown to 4 Nov 2026 18:00 (Almaty) — the only part CSS can't do.
    (function () {
        var target = new Date('2026-11-04T18:00:00+05:00').getTime();
        var el = {};
        document.querySelectorAll('[data-cd]').forEach(function (e) {
            el[e.dataset.cd] = e;
        });

        function tick() {
            var t = Math.max(0, target - Date.now()) / 1000;
            el.d.textContent = Math.floor(t / 86400);
            el.h.textContent = Math.floor(t / 3600) % 24;
            el.m.textContent = Math.floor(t / 60) % 60;
            el.s.textContent = Math.floor(t) % 60;
        }

        tick();
        setInterval(tick, 1000);
    })();

    // RSVP + wish forms → Apps Script endpoint (see README curls); results and errors shown in #form-popup.
    (function () {
        var popup = document.getElementById('form-popup');

        // Texts are keys from translations.css, so the popup follows the ҚАЗ / РУС switch.
        function show(ok, textKey) {
            popup.querySelector('[data-popup-title]').dataset.i18n = ok ? 'popup.ok_title' : 'popup.error_title';
            popup.querySelector('[data-popup-text]').dataset.i18n = textKey;
            popup.showModal();
        }

        // Click on the backdrop closes the popup.
        popup.addEventListener('click', function (ev) {
            if (ev.target === popup) popup.close();
        });

        document.querySelectorAll('form[data-action]').forEach(function (form) {
            var btn = form.querySelector('[type=submit]');
            form.addEventListener('submit', function (ev) {
                ev.preventDefault();
                var invalid = form.querySelector(':invalid');
                if (invalid) {
                    show(false, 'form.invalid_' + invalid.name);
                    popup.addEventListener('close', function () { invalid.focus(); }, {once: true});
                    return;
                }
                btn.disabled = true;
                // text/plain keeps it a "simple" request, so no CORS preflight (Apps Script can't answer one).
                fetch(API + '?action=' + form.dataset.action, {
                    method: 'POST',
                    headers: {'Content-Type': 'text/plain;charset=utf-8'},
                    body: JSON.stringify(Object.fromEntries(new FormData(form)))
                }).then(function (r) {
                    return r.json();
                }).then(function (res) {
                    if (res.success) {
                        form.reset();
                        show(true, 'form.sent');
                    } else {
                        show(false, res.code === 503 ? 'form.busy' : 'form.error');
                    }
                }, function () {
                    show(false, navigator.onLine === false ? 'form.offline' : 'form.error');
                }).finally(function () {
                    btn.disabled = false;
                });
            });
        });
    })();
    // Guest wishes carousel ← GET ?action=wishes (up to 10 random). Section stays hidden if there are none.
    (function () {
        var section = document.getElementById('wishes');
        var box = section.querySelector('[data-wishes]');
        var track = box.querySelector('.car-track');
        var dots = box.querySelector('[data-wish-dots]');
        var slideTpl = document.getElementById('wish-slide').content;
        var arrowTpl = document.getElementById('wish-arrows').content;

        // Date per language, through the same --kk / --ru mechanism as translations.css.
        function setDate(el, ts) {
            var d = new Date(ts);
            if (isNaN(d)) return;
            var p = d.toLocaleDateString('en-CA', {timeZone: 'Asia/Almaty'}); // YYYY-MM-DD
            el.style.setProperty('--kk', JSON.stringify(p));
            el.style.setProperty('--ru', JSON.stringify(p.split('-').reverse().join('.')));
        }

        fetch(API + '?action=wishes').then(function (r) {
            return r.json();
        }).then(function (res) {
            var list = (res.wishes || []).filter(function (w) { return w.wish; }).slice(0, 10);
            var n = list.length;
            if (!n) return;
            list.forEach(function (w, i) {
                var radio = document.createElement('input');
                radio.type = 'radio';
                radio.name = 'wish-car';
                radio.id = 'wish-' + i;
                radio.className = 'sr-only';
                radio.checked = i === 0;
                box.prepend(radio);

                var slide = slideTpl.cloneNode(true);
                slide.querySelector('[data-wish-name]').textContent = w.name;
                slide.querySelector('[data-wish-text]').textContent = w.wish;
                setDate(slide.querySelector('[data-wish-date]'), w.timestamp);
                track.appendChild(slide);

                if (n < 2) return;
                var dot = document.createElement('label');
                dot.htmlFor = 'wish-' + i;
                dot.dataset.dot = i;
                dot.className = 'car-dot rounded-full transition-all';
                dots.appendChild(dot);

                var arrows = arrowTpl.cloneNode(true).querySelectorAll('label');
                arrows[0].htmlFor = 'wish-' + (i - 1 + n) % n;
                arrows[1].htmlFor = 'wish-' + (i + 1) % n;
                arrows.forEach(function (a) {
                    a.dataset.at = i;
                    box.appendChild(a);
                });
            });
            section.hidden = false;
        }).catch(function () {});
    })();
</script>
